services:
  - type: web
    name: popkid-bot
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install --omit=dev --no-audit --no-fund
    startCommand: node index.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: SESSION_ID
        sync: false
      - key: OCR_API_KEY
        sync: false
